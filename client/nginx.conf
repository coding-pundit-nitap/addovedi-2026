server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively; index.html itself must
    # always revalidate so deploys show up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router): fall back to index.html for any
    # path that isn't a real file, instead of nginx 404ing on e.g. /about.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
