server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same baseline security headers as vercel.json (the self-hosted path has to ship them too). nginx drops server-level
    # add_header lines inside any location that sets its own add_header, so the blocks below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively; index.html itself must
    # always revalidate so deploys show up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Client-side routing (React Router): fall back to index.html for any
    # path that isn't a real file, instead of nginx 404ing on e.g. /about.
    # The HTML shell must never be served stale from a browser/proxy cache, or users keep the old
    # bundle (and old behaviour) after a redeploy. try_files below falls back to this location.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # NOTE: no `$uri/` here. public/crew/ is a real folder, so refreshing the /crew PAGE matched that
    # directory and nginx answered 403 (no index file, listing off). Only exact files are served as files.
    location / {
        try_files $uri /index.html;
    }
}
