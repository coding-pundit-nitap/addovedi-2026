# Per-IP request-rate guard in front of the API (the app has its own, finer-grained limiters;
# this stops floods before they reach Node). Sized for a whole campus that may share one address:
# 100 r/s sustained with bursts of 400, 600 connections per address.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_rl:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;
    limit_conn conn_rl 600;
    server_tokens off;

    # Backend API — proxied by compose service name.
    location /api/ {
        limit_req zone=api_rl burst=400 nodelay;
        limit_req_status 429;
        proxy_pass http://server:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a visitor-supplied header must not reach the app
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the built React app, served by the client
    # container's own nginx (handles SPA fallback routing itself).
    location / {
        proxy_pass http://client:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a visitor-supplied header must not reach the app
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
